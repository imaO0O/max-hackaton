openapi: 3.1.0
info:
  title: «После 9-го» — API мини-приложения
  version: 0.1.0
  description: |
    Внутренний API, который вызывает мини-приложение MAX. Справочные методы открыты,
    личные методы требуют заголовок `X-Max-Init-Data` — строку `window.WebApp.initData`,
    подписанную платформой MAX (проверяется HMAC-SHA256 с токеном бота).

    Ошибки возвращаются в едином формате `{ "error": { "code", "message" } }`.
servers:
  - url: https://158-160-18-41.sslip.io
    description: Развёрнутый сервис
  - url: http://localhost:8080
    description: Локальный запуск
tags:
  - name: service
    description: Состояние сервиса и приём событий MAX
  - name: reference
    description: Справочники и колледжи
  - name: profile
    description: Ответы семьи
  - name: plan
    description: План, отметки, отправка подростку
  - name: favorites
    description: Избранные программы колледжей
  - name: reports
    description: Сообщения о неточностях в данных

components:
  securitySchemes:
    maxInitData:
      type: apiKey
      in: header
      name: X-Max-Init-Data
      description: Строка `window.WebApp.initData` из MAX Bridge.
    maxWebhookSecret:
      type: apiKey
      in: header
      name: X-Max-Bot-Api-Secret
      description: Секрет подписки Webhook — BOT_WEBHOOK_SECRET или значение, выведенное из токена бота.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [unauthorized, validation_error, not_found, profile_incomplete, bot_unavailable]
            message:
              type: string
    Region:
      type: object
      required: [id, name, utcOffsetHours, twoOgeExperiment, isDemo]
      properties:
        id: { type: string, examples: [demo-standard] }
        name: { type: string }
        utcOffsetHours: { type: integer }
        twoOgeExperiment: { type: boolean, description: Регион участвует в эксперименте с двумя ОГЭ }
        isDemo: { type: boolean }
        profileClassRules: { type: [string, 'null'] }
        profileClassRulesUrl: { type: [string, 'null'] }
        checkedAt: { type: [string, 'null'], format: date }
        hasColleges: { type: boolean, description: 'Есть ли колледжи региона в справочнике. Если нет — план по федеральным срокам, город не нужен' }
        experimentList:
          description: Перечень колледжей и профессий эксперимента с двумя ОГЭ, по которому отмечены программы. null — перечня в справочнике нет
          oneOf:
            - type: 'null'
            - type: object
              required: [year]
              properties:
                year: { type: integer, examples: [2026] }
                sourceUrl: { type: [string, 'null'] }
                checkedAt: { type: [string, 'null'], format: date }
    Interest:
      type: object
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }
        emoji: { type: [string, 'null'] }
    Program:
      type: object
      required: [id, specialtyCode, specialtyTitle, form]
      properties:
        id: { type: string, examples: [demo-it-college--090207--full_time] }
        specialtyCode: { type: string, examples: ['09.02.07'] }
        specialtyTitle: { type: string }
        interestId: { type: string }
        form: { type: string, enum: [full_time, part_time, extramural] }
        duration: { type: [string, 'null'] }
        budgetPlaces: { type: [integer, 'null'] }
        passingScore: { type: [number, 'null'], description: Проходной средний балл прошлого года }
        scoreYear: { type: [integer, 'null'] }
        entranceTest: { type: [string, 'null'] }
        sourceUrl: { type: [string, 'null'] }
        checkedAt: { type: [string, 'null'], format: date }
        inExperimentList: { type: boolean, description: Колледж и профессия были в перечне эксперимента региона — на программу поступали с аттестатом по двум ОГЭ }
    College:
      type: object
      required: [id, regionId, city, name, isDemo, programs]
      properties:
        id: { type: string }
        regionId: { type: string }
        city: { type: string }
        name: { type: string }
        address: { type: [string, 'null'] }
        website: { type: [string, 'null'] }
        hasDormitory: { type: boolean }
        isDemo: { type: boolean }
        inExperimentList: { type: boolean, description: Колледж в перечне эксперимента с двумя ОГЭ }
        programs:
          type: array
          items: { $ref: '#/components/schemas/Program' }
    FavoriteProgram:
      allOf:
        - $ref: '#/components/schemas/Program'
        - type: object
          required: [college]
          properties:
            college:
              type: object
              properties:
                id: { type: string }
                name: { type: string }
                city: { type: string }
                isDemo: { type: boolean }
    Profile:
      type: object
      required: [interests, remindersEnabled, isComplete]
      properties:
        regionId: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        grade: { type: [integer, 'null'], enum: [8, 9, null] }
        path: { type: [string, 'null'], enum: [school10, college, undecided, null] }
        interests: { type: array, items: { type: string } }
        remindersEnabled: { type: boolean }
        isComplete: { type: boolean }
    ProfileInput:
      type: object
      required: [regionId, grade, path]
      additionalProperties: false
      properties:
        regionId: { type: string }
        city: { type: [string, 'null'] }
        grade: { type: integer, enum: [8, 9] }
        path: { type: string, enum: [school10, college, undecided] }
        interests: { type: array, maxItems: 20, items: { type: string } }
        remindersEnabled: { type: boolean }
    PlanItem:
      type: object
      required: [id, scope, kind, path, dateStart, title, description, status, done]
      properties:
        id: { type: string }
        academicYear: { type: string, examples: [2026/2027] }
        grade: { type: integer, enum: [8, 9], description: '8 — шаг 8 класса (из года перед планом 9 класса), 9 — дата 9 класса' }
        scope: { type: string, enum: [federal, regional, recommendation] }
        regionId: { type: [string, 'null'] }
        kind: { type: string, enum: [deadline, event, period, checklist] }
        path: { type: string, enum: [any, school10, college] }
        experiment: { type: string, enum: [any, two_oge, standard] }
        dateStart: { type: string, format: date }
        dateEnd: { type: [string, 'null'], format: date }
        isApproximate: { type: boolean }
        title: { type: string }
        description: { type: string }
        reminders:
          type: array
          items:
            type: object
            properties:
              anchor: { type: string, enum: [start, end] }
              daysBefore: { type: integer }
        sourceTitle: { type: [string, 'null'] }
        sourceUrl: { type: [string, 'null'] }
        checkedAt: { type: [string, 'null'], format: date }
        status: { type: string, enum: [past, current, upcoming] }
        daysLeft: { type: [integer, 'null'] }
        done: { type: boolean }
        steps:
          type: array
          description: Шаги чек-листа с отметками семьи. У обычных пунктов — пустой список
          items:
            type: object
            required: [id, title, done]
            properties:
              id: { type: string, examples: [documents] }
              title: { type: string }
              done: { type: boolean }
    Plan:
      type: object
      required: [academicYear, today, region, profile, items, nextItemId]
      properties:
        academicYear: { type: string, description: 'Учебный год плана. Для 8 класса — следующий год (9 класс)' }
        isAdvance: { type: boolean, description: 'План восьмиклассника: шаги 8 класса текущего года и даты 9 класса' }
        today: { type: string, format: date }
        region: { $ref: '#/components/schemas/Region' }
        profile: { $ref: '#/components/schemas/Profile' }
        items: { type: array, items: { $ref: '#/components/schemas/PlanItem' } }
        nextItemId: { type: [string, 'null'] }
        followersCount: { type: integer }
        pendingReminders: { type: integer }
  responses:
    Unauthorized:
      description: Нет или неверна подпись initData
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Некорректные параметры
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Слишком много запросов с одного IP (RATE_LIMIT_PER_MINUTE, по умолчанию 300 в минуту)
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить запрос
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ProfileIncomplete:
      description: Профиль семьи не заполнен (code = profile_incomplete)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  /api/health:
    get:
      operationId: getHealth
      security: []
      tags: [service]
      summary: Проверка работоспособности
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                    description: 'degraded — бот не на связи с MAX Bot API три проверки подряд или не запустился'
                  bot: { type: string, enum: [starting, running, stopped, failed, unreachable, disabled] }
                  academicYear: { type: string }
                  botMode: { type: [string, 'null'], enum: [polling, webhook, null], description: 'Как бот получает события MAX: Long Polling или Webhook' }
                  version: { type: string, description: 'Развёрнутая версия: тег и коммит, например «v0.3.0 (a95e3fa)»; при сборке без scripts/deploy.sh — local', examples: ['v0.3.0 (a95e3fa)'] }

  /api/meta:
    get:
      operationId: getMeta
      security: []
      tags: [service]
      summary: Учебный год и имя бота — для ссылок в мини-приложении
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Сведения о сервисе
          content:
            application/json:
              schema:
                type: object
                properties:
                  academicYear: { type: string, examples: [2026/2027] }
                  botUsername: { type: [string, 'null'] }

  /bot/webhook:
    post:
      operationId: receiveMaxUpdate
      security: [{ maxWebhookSecret: [] }]
      tags: [service]
      summary: Приём событий MAX Bot API (только при BOT_MODE=webhook)
      description: |
        Вызывает платформа MAX, а не мини-приложение. Адрес регистрируется сервером через
        POST /subscriptions MAX Bot API при запуске. Сервер отвечает сразу, событие обрабатывает после ответа.
        При BOT_MODE=polling маршрут не зарегистрирован (404).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [update_type]
              properties:
                update_type: { type: string, examples: [message_created, message_callback, bot_started] }
      responses:
        '200':
          description: Событие принято
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        '400':
          description: Тело не похоже на событие MAX
        '401':
          description: Неверный или отсутствующий секрет в X-Max-Bot-Api-Secret

  /api/regions:
    get:
      operationId: listRegions
      security: []
      tags: [reference]
      summary: Регионы
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Список регионов
          content:
            application/json:
              schema:
                type: object
                properties:
                  regions: { type: array, items: { $ref: '#/components/schemas/Region' } }

  /api/regions/{regionId}/cities:
    get:
      operationId: listCities
      security: []
      tags: [reference]
      summary: Города региона, в которых есть колледжи
      parameters:
        - { name: regionId, in: path, required: true, schema: { type: string } }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Список городов
          content:
            application/json:
              schema:
                type: object
                properties:
                  cities: { type: array, items: { type: string } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/interests:
    get:
      operationId: listInterests
      security: []
      tags: [reference]
      summary: Сферы интересов
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Список сфер
          content:
            application/json:
              schema:
                type: object
                properties:
                  interests: { type: array, items: { $ref: '#/components/schemas/Interest' } }

  /api/specialties:
    get:
      operationId: listSpecialties
      security: []
      tags: [reference]
      summary: Специальности СПО
      parameters:
        - name: interestId
          in: query
          required: false
          schema: { type: string }
          description: Оставить только специальности выбранной сферы
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Список специальностей
          content:
            application/json:
              schema:
                type: object
                properties:
                  specialties:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, examples: ['09.02.07'] }
                        title: { type: string }
                        interestId: { type: string }

  /api/content:
    get:
      operationId: getContent
      security: []
      tags: [reference]
      summary: Тексты экранов «Два пути» и «Что дальше» с источниками
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Содержимое экранов

  /api/colleges:
    get:
      operationId: searchColleges
      security: []
      tags: [reference]
      summary: Поиск колледжей региона
      parameters:
        - { name: regionId, in: query, required: true, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - { name: interests, in: query, description: Сферы через запятую, schema: { type: string, examples: ['it,medicine'] } }
        - { name: specialty, in: query, schema: { type: string, examples: ['09.02.07'] } }
        - { name: form, in: query, schema: { type: string, enum: [full_time, part_time, extramural] } }
        - { name: budgetOnly, in: query, schema: { type: boolean } }
        - { name: experimentList, in: query, description: Только программы из перечня эксперимента с двумя ОГЭ, schema: { type: boolean } }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Колледжи с подходящими программами
          content:
            application/json:
              schema:
                type: object
                properties:
                  colleges: { type: array, items: { $ref: '#/components/schemas/College' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/colleges/{collegeId}:
    get:
      operationId: getCollege
      security: []
      tags: [reference]
      summary: Колледж со всеми программами
      parameters:
        - { name: collegeId, in: path, required: true, schema: { type: string } }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Колледж
          content:
            application/json:
              schema:
                type: object
                properties:
                  college: { $ref: '#/components/schemas/College' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/session:
    get:
      operationId: getSession
      tags: [profile]
      summary: Текущий пользователь, параметр запуска и профиль
      security: [{ maxInitData: [] }]
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Сессия
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: integer }
                  startParam: { type: [string, 'null'], examples: [plan_Ej-h4c_6uvdC9Spst6DkIw] }
                  profile: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Профиль семьи
      security: [{ maxInitData: [] }]
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: saveProfile
      tags: [profile]
      summary: Сохранить ответы семьи и пересобрать напоминания
      security: [{ maxInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Сохранённый профиль
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteProfile
      tags: [profile]
      summary: Удалить все данные пользователя
      description: Профиль, план, отметки, избранное, подписки и напоминания удаляются, в журнале событий ID обнуляется. Повторный вызов безопасен.
      security: [{ maxInitData: [] }]
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Данные удалены
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/profile/reminders:
    put:
      operationId: setReminders
      tags: [profile]
      summary: Включить или выключить напоминания
      security: [{ maxInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Профиль
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/plan:
    get:
      operationId: getPlan
      tags: [plan]
      summary: План на учебный год под профиль семьи
      security: [{ maxInitData: [] }]
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: План
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/ProfileIncomplete' }

  /api/plan/items/{itemId}:
    put:
      operationId: setPlanItemDone
      tags: [plan]
      summary: Отметить пункт плана выполненным
      security: [{ maxInitData: [] }]
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Отметка сохранена
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ProfileIncomplete' }

  /api/plan/items/{itemId}/steps/{stepId}:
    put:
      operationId: setPlanStepDone
      tags: [plan]
      summary: Отметить шаг чек-листа
      description: Когда отмечены все шаги, пункт плана выполняется сам и напоминания по нему больше не приходят. Если снять отметку с шага выполненного пункта — пункт снова не выполнен.
      security: [{ maxInitData: [] }]
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, examples: [2627-chk-summer-checklist] } }
        - { name: stepId, in: path, required: true, schema: { type: string, examples: [documents] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Отметка сохранена
          content:
            application/json:
              schema:
                type: object
                required: [id, stepId, done, itemDone, stepsDone]
                properties:
                  id: { type: string }
                  stepId: { type: string }
                  done: { type: boolean }
                  itemDone: { type: boolean, description: Выполнен ли пункт после этой отметки }
                  stepsDone: { type: integer, description: Сколько шагов пункта отмечено }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ProfileIncomplete' }

  /api/plan/share:
    post:
      operationId: createShareLink
      tags: [plan]
      summary: Ссылка на план для подростка или второго родителя
      description: Возвращает постоянную ссылку вида `https://max.ru/<бот>?startapp=plan_<токен>`.
      security: [{ maxInitData: [] }]
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Ссылка и готовый текст сообщения
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  link: { type: string, format: uri }
                  text: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/ProfileIncomplete' }
        '503':
          description: Бот не подключён, имя бота для ссылки неизвестно
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: revokeShareLink
      tags: [plan]
      summary: Отозвать ссылку на план
      description: Старая ссылка перестаёт открываться, подписчики и их напоминания по плану удаляются. Следующий POST создаст новую ссылку.
      security: [{ maxInitData: [] }]
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Результат отзыва
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean, description: false — ссылки не было }
                  followersRemoved: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/plan/calendar-link:
    post:
      operationId: createCalendarLink
      tags: [plan]
      summary: Одноразовая ссылка на файл календаря с датами плана
      description: |
        Ссылка передаётся в `WebApp.downloadFile(url, fileName)`. Нативный клиент MAX скачивает файл
        без заголовков авторизации, поэтому доступ подтверждается подписью в самой ссылке. Ссылка действует 10 минут.
      security: [{ maxInitData: [] }]
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Ссылка на файл .ics
          content:
            application/json:
              schema:
                type: object
                required: [url, fileName, expiresInSeconds, eventsCount]
                properties:
                  url: { type: string, format: uri, examples: ['https://158-160-18-41.sslip.io/api/calendar/7007.1790000000.abc.ics'] }
                  fileName: { type: string, examples: [posle9-plan-2026-2027.ics] }
                  expiresInSeconds: { type: integer, examples: [600] }
                  eventsCount: { type: integer, description: Сколько дат попадёт в календарь }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/ProfileIncomplete' }

  /api/reports:
    post:
      operationId: reportInaccuracy
      tags: [reports]
      summary: Сообщить о неточности в данных
      description: Программа колледжа или пункт плана и причина из списка — без свободного текста, лишние поля отбрасываются. Одна семья сообщает об одной неточности один раз. После удаления данных пользователя сообщение остаётся обезличенным. Сводка для команды проекта — команда /reports в боте.
      security: [{ maxInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, reason]
              properties:
                targetType: { type: string, enum: [program, item] }
                targetId: { type: string, examples: [tat-kazan-construction-college--080127--full_time, 2627-fed-college-admission] }
                reason:
                  type: string
                  description: 'Для program — score, program, link, other; для item — date, link, other'
                  examples: [score]
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Сообщение сохранено
          content:
            application/json:
              schema: { type: object, required: [created], properties: { created: { type: boolean, const: true } } }
        '200':
          description: Эта семья уже сообщала о той же неточности
          content:
            application/json:
              schema: { type: object, required: [created], properties: { created: { type: boolean, const: false } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/calendar/{file}:
    get:
      operationId: downloadCalendar
      security: []
      tags: [plan]
      summary: Файл календаря (iCalendar) по одноразовой ссылке
      description: События на весь день для непрошедших пунктов плана, у каждого — напоминание накануне в 9:00.
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9.A-Za-z_-]{1,120}\.ics$'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Файл .ics
          content:
            text/calendar:
              schema: { type: string }
        '410':
          description: Ссылка устарела или подделана (code = link_expired)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/shared-plans/{token}:
    get:
      operationId: getSharedPlan
      tags: [plan]
      summary: План семьи по ссылке (только чтение)
      security: [{ maxInitData: [] }]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: План, признак владельца и подписки, избранное семьи
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/shared-plans/{token}/follow:
    put:
      operationId: setFollowing
      tags: [plan]
      summary: Подписаться на напоминания по чужому плану
      security: [{ maxInitData: [] }]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [follow]
              properties:
                follow: { type: boolean }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Новое состояние подписки
          content:
            application/json:
              schema:
                type: object
                properties:
                  isFollowing: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/favorites:
    get:
      operationId: listFavorites
      tags: [favorites]
      summary: Избранные программы
      security: [{ maxInitData: [] }]
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorites: { type: array, items: { $ref: '#/components/schemas/FavoriteProgram' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/favorites/{programId}:
    put:
      operationId: addFavorite
      tags: [favorites]
      summary: Добавить программу в избранное
      security: [{ maxInitData: [] }]
      parameters:
        - { name: programId, in: path, required: true, schema: { type: string } }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Добавлено (повторный вызов не создаёт дубликат)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: removeFavorite
      tags: [favorites]
      summary: Убрать программу из избранного
      security: [{ maxInitData: [] }]
      parameters:
        - { name: programId, in: path, required: true, schema: { type: string } }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Убрано
        '401': { $ref: '#/components/responses/Unauthorized' }
