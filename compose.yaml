# Запуск всех локальных компонентов одной командой:
#   docker compose up --build
# С HTTPS-прокси (нужен домен, направленный на сервер, и открытые порты 80/443):
#   docker compose --profile https up --build -d

# Логи контейнеров: не больше 3 файлов по 10 МБ, чтобы за время проверки не занять диск сервера
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: posle9:local
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_PATH: /app/storage/posle9.sqlite
    ports:
      # По умолчанию порт доступен только с этой машины: снаружи сервис открывается через HTTPS-прокси Caddy.
      # Открыть порт в сеть без прокси — APP_BIND=0.0.0.0 в .env
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - storage:/app/storage
    logging: *logging
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to app:8080
    volumes:
      - caddy_data:/data
    logging: *logging
    restart: unless-stopped

volumes:
  storage:
  caddy_data:
